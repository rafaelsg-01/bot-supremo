# bot-supremo no notebook. Quem sobe e atualiza é o implantacao/atualizar.sh (timer do systemd).
services:
  bot:
    image: ghcr.io/rafaelsg-01/bot-supremo:latest
    container_name: bot-supremo
    # Mesma rede do container "warp": tudo (DNS, WebRTC, QUIC) sai pelo WARP, sem flag de proxy.
    # A API fica em warp:8080 para quem está na rede flare-net.
    network_mode: "container:warp"
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
    shm_size: 1g
    mem_limit: 1800m
    stop_grace_period: 30s
    # GPU real e os terminais que o Xorg usa.
    devices:
      - /dev/dri:/dev/dri
      - /dev/tty0:/dev/tty0
      - /dev/tty7:/dev/tty7
    cap_add:
      - SYS_TTY_CONFIG
    # Perfil seccomp padrão do Docker + clone/unshare/setns liberados, para a sandbox do Chrome
    # funcionar (nunca --no-sandbox). Gerado a partir de moby/profiles/seccomp/default.json.
    security_opt:
      - seccomp=docker/seccomp-chrome.json
    volumes:
      # Perfil do Chrome (cookies, sessão, login do Google). Sobrevive a recriar o container.
      - ./dados/perfil:/perfil
      # Chave e pacote da extensão própria.
      - ./dados/estado:/estado
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Serviço de vídeo (video.iptv01.asia): cache do link mp4 e repasse do vídeo. O site prende o link
  # ao IP de quem o gerou, então o vídeo tem que sair daqui, pelo mesmo WARP do Chrome.
  # Container à parte (mesma imagem): se o Chrome travar ou reiniciar, os vídeos continuam.
  # Fica em warp:8070. O cache (SQLite, sem prazo) mora em dados/video.
  video:
    image: ghcr.io/rafaelsg-01/bot-supremo:latest
    container_name: bot-supremo-video
    network_mode: "container:warp"
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
    user: "1000:1000"
    working_dir: /opt/bot-supremo
    entrypoint: ["python3", "-m", "video.app"]
    volumes:
      - ./dados/video:/dados
    mem_limit: 256m
    stop_grace_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Painel de monitoramento (painel.iptv01.asia), com login. Mesma imagem do bot, outro comando.
  # Fica fora da rede do warp de propósito: se o bot ou o warp caírem, o painel continua de pé.
  # O socket do Docker é para ver os containers, ler o log e reiniciar (só ações fixas).
  painel:
    image: ghcr.io/rafaelsg-01/bot-supremo:latest
    container_name: bot-supremo-painel
    restart: unless-stopped
    networks: [flare-net]
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
    working_dir: /opt/bot-supremo
    entrypoint: ["python3", "-m", "painel.app"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/class/thermal:/sys/class/thermal:ro
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Túnel próprio da Cloudflare, com os endereços em implantacao/tunel.yml:
  # bot.iptv01.asia -> http://warp:8080 (a API), video.iptv01.asia -> http://warp:8070 e
  # painel.iptv01.asia -> http://bot-supremo-painel:8090.
  # A credencial fica em dados/tunel/credenciais.json e o ID do túnel no .env (TUNEL_ID).
  tunel:
    image: cloudflare/cloudflared:latest
    container_name: bot-supremo-tunel
    restart: unless-stopped
    networks: [flare-net]
    volumes:
      - ./dados/tunel/credenciais.json:/etc/cloudflared/credenciais.json:ro
      - ./implantacao/tunel.yml:/etc/cloudflared/tunel.yml:ro
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/tunel.yml
      - --credentials-file
      - /etc/cloudflared/credenciais.json
      - run
      - ${TUNEL_ID}
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  flare-net:
    external: true
