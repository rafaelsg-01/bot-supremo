# Xorg na GPU Intel real do notebook, na tela interna (LVDS-1), resolução nativa.
# Assim o WebGL do Chrome mostra a placa de verdade, e não o "SwiftShader" do Xvfb.

Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "DontVTSwitch" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Device"
    Identifier "intel"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
EndSection

Section "Monitor"
    Identifier "LVDS-1"
    Option "DPMS" "false"
EndSection

Section "Screen"
    Identifier "tela"
    Device "intel"
    Monitor "LVDS-1"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1366x768"
    EndSubSection
EndSection
