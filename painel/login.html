<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do bot</title>
<style>
  :root { --fundo: #f3f4f6; --cartao: #fff; --texto: #111827; --suave: #6b7280; --borda: #d1d5db; --azul: #2563eb; --vermelho: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --fundo: #0f172a; --cartao: #1e293b; --texto: #f1f5f9; --suave: #94a3b8; --borda: #334155; --azul: #3b82f6; --vermelho: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fundo); color: var(--texto);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  form { background: var(--cartao); border: 1px solid var(--borda); border-radius: 12px; padding: 28px; width: 100%; max-width: 340px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p { margin: 0 0 20px; color: var(--suave); font-size: 14px; }
  label { display: block; font-size: 14px; margin: 12px 0 4px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--borda); border-radius: 8px; background: transparent; color: inherit; font-size: 16px; }
  button { margin-top: 20px; width: 100%; padding: 11px; border: 0; border-radius: 8px; background: var(--azul); color: #fff; font-size: 16px; cursor: pointer; }
  .erro { color: var(--vermelho); font-size: 14px; margin-top: 12px; min-height: 1em; }
</style>
</head>
<body>
<form method="post" action="/entrar">
  <h1>Painel do bot</h1>
  <p>bot-supremo · notebook</p>
  <label for="usuario">Usuário</label>
  <input id="usuario" name="usuario" autocomplete="username" required autofocus>
  <label for="senha">Senha</label>
  <input id="senha" name="senha" type="password" autocomplete="current-password" required>
  <button type="submit">Entrar</button>
  <div class="erro" id="erro"></div>
</form>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('erro') === 'senha') document.getElementById('erro').textContent = 'Usuário ou senha errados.';
  if (q.get('erro') === 'bloqueado') document.getElementById('erro').textContent =
    'Muitas tentativas erradas. Tente de novo em ' + (q.get('min') || '15') + ' min.';
</script>
</body>
</html>
